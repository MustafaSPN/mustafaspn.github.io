<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Mustafa Sepen — robotics">
  <rect width="32" height="32" fill="#0d0e10"/>

  <!-- suspension struts, drawn first so the wheels cover their ends -->
  <g stroke="#e9e7e4" stroke-width="2.1" stroke-linecap="round">
    <path d="M11.5 19.5 8 24.4"/>
    <path d="M20.5 19.5 24 24.4"/>
  </g>

  <!-- instrument arm -->
  <path d="M22 11.4 25.6 6.6" fill="none" stroke="#e9e7e4" stroke-width="2.1" stroke-linecap="round"/>
  <circle cx="26.3" cy="5.5" r="2.3" fill="#e4572e"/>

  <!-- chassis -->
  <rect x="6.5" y="13.6" width="19" height="6.6" rx="1.6" fill="#e4572e"/>
  <rect x="4.4" y="10.9" width="23.2" height="3" rx="1.3" fill="#e9e7e4"/>

  <!-- mast and camera head -->
  <rect x="10.6" y="5.8" width="2.2" height="5.4" fill="#e9e7e4"/>
  <rect x="7.5" y="2.2" width="8.4" height="4.7" rx="2.35" fill="#e9e7e4"/>
  <circle cx="10.2" cy="4.55" r="0.9" fill="#0d0e10"/>
  <circle cx="13.2" cy="4.55" r="0.9" fill="#0d0e10"/>

  <!-- wheels, last so they sit over the struts. Solid discs rather than rings:
       at a 16px tab size a ring dissolves into grey, a disc keeps its mass. -->
  <g fill="#e9e7e4">
    <circle cx="8" cy="24.4" r="4.6"/>
    <circle cx="24" cy="24.4" r="4.6"/>
  </g>
  <g fill="#0d0e10">
    <circle cx="8" cy="24.4" r="1.7"/>
    <circle cx="24" cy="24.4" r="1.7"/>
  </g>
</svg>
